# Cube Agree C:62 Race 2026 price monitor — GitHub Actions workflow
#
# Placement in your repository:
#   .github/workflows/monitor.yml
#
# The repository root must also contain:
#   cube_agree_price_monitor.py
#   requirements.txt
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID        (comma-separated for multiple recipients)

name: Bike price monitor

on:
  schedule:
    # Twice daily: 9:00 AM and 5:00 PM Sydney time.
    # GitHub cron is UTC; Sydney is UTC+11 during daylight saving (Oct-Apr),
    # so 9am/5pm AEDT = 22:00/06:00 UTC. When daylight saving ends in April
    # (Sydney -> UTC+10), runs shift to 10am/6pm local — adjust then if needed.
    # Note: GitHub only fires schedules from the DEFAULT branch (main), and
    # scheduled runs can be delayed up to ~30-60 min during peak load.
    - cron: "0 6,22 * * *"
  workflow_dispatch:            # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write               # allow committing the state file back to the repo

concurrency:
  group: price-monitor          # never run two checks at the same time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          missing=0
          for f in cube_agree_price_monitor.py requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f — upload it to the repository root."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # NOTE: no pip cache here — setup-python's cache hard-fails the job
          # when requirements.txt is missing; these deps install in seconds
          # anyway.

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not set — checks will run but no alerts can be sent. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under Settings -> Secrets and variables -> Actions."
          fi
          python cube_agree_price_monitor.py --once

      - name: Commit updated price state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f price_state.json ] || exit 0          # nothing to save if the check never ran
          git add price_state.json
          git diff --cached --quiet && exit 0        # no changes -> nothing to commit
          git commit -m "Update price state [skip ci]"
          git push
